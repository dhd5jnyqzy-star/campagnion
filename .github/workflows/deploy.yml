name: Deploy PWA to GitHub Pages

# Baut die App bei jedem Push auf main und veröffentlicht dist/ auf GitHub
# Pages (https → Secure Context für Service Worker / PWA-Installation).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # DEPLOY_BASE = Repo-Unterpfad; muss zum Repo-Namen passen (siehe vite.config.ts).
      - run: npm run build
        env:
          DEPLOY_BASE: /campagnion/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
